<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Volunteer Dashboard | Paws & Wings</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link rel="stylesheet" href="../assets/css/style.css">

<style>

/* =========================
   PINK + WHITE THEME
========================= */

:root {
    --pink: #e95b9f;
    --dark-pink: #d94789;
    --light-pink: #fff0f6;
    --border-pink: #f3bfd5;
}

body {
    background: #ffffff !important;
}


/* =========================
   REMOVE GREEN
========================= */

.btn-success {
    background: var(--pink) !important;
    border-color: var(--pink) !important;
    color: #ffffff !important;
}

.btn-success:hover {
    background: var(--dark-pink) !important;
    border-color: var(--dark-pink) !important;
}


/* =========================
   HEADER
========================= */

.volunteer-header {
    position: relative;
    overflow: hidden;

    padding: 65px 0;

    background:
        linear-gradient(
            135deg,
            var(--light-pink),
            #ffffff
        ) !important;
}

.volunteer-header h1 {
    color: var(--dark-pink);
    font-weight: 700;
}

.volunteer-header .text-muted {
    color: #666666 !important;
}


/* Floating circles */

.volunteer-header::before {
    content: "";

    position: absolute;

    width: 150px;
    height: 150px;

    border-radius: 50%;

    background: rgba(233, 91, 159, 0.10);

    right: 10%;
    top: 15px;

    animation: floatCircle 4s ease-in-out infinite;
}

.volunteer-header::after {
    content: "";

    position: absolute;

    width: 65px;
    height: 65px;

    border-radius: 50%;

    background: rgba(233, 91, 159, 0.15);

    right: 28%;
    bottom: 15px;

    animation: floatCircle 3s ease-in-out infinite reverse;
}

@keyframes floatCircle {

    0%,
    100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-18px);
    }

}


/* =========================
   DASHBOARD CARD
========================= */

.volunteer-card {

    position: relative;

    background: #ffffff;

    border: 2px solid var(--border-pink);

    border-radius: 20px;

    padding: 35px;

    box-shadow:
        0 12px 35px rgba(233, 91, 159, 0.12);

    overflow: hidden;

    animation: cardAppear 0.8s ease;
}

@keyframes cardAppear {

    from {
        opacity: 0;
        transform: translateY(25px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}


/* Animated top border */

.volunteer-card::before {

    content: "";

    position: absolute;

    width: 100%;
    height: 4px;

    left: -100%;
    top: 0;

    background: var(--pink);

    animation: topLine 3s linear infinite;
}

@keyframes topLine {

    from {
        left: -100%;
    }

    to {
        left: 100%;
    }

}


/* =========================
   VOLUNTEER ANIMATION
========================= */

.volunteer-animation {

    width: 120px;
    height: 120px;

    margin: 0 auto 25px;

    border-radius: 50%;

    background: var(--light-pink);

    border: 2px solid var(--pink);

    position: relative;

    overflow: hidden;
}


/* Person */

.volunteer-person {

    position: absolute;

    width: 28px;
    height: 38px;

    background: var(--pink);

    border-radius: 14px 14px 8px 8px;

    left: 27px;
    bottom: 20px;

    animation: volunteerWalk 3s ease-in-out infinite;
}


/* Head */

.volunteer-person::before {

    content: "";

    position: absolute;

    width: 22px;
    height: 22px;

    border-radius: 50%;

    background: var(--dark-pink);

    left: 3px;
    top: -18px;
}


/* Arm */

.volunteer-person::after {

    content: "";

    position: absolute;

    width: 25px;
    height: 7px;

    background: var(--dark-pink);

    border-radius: 5px;

    right: -17px;
    top: 12px;

    transform: rotate(-20deg);

    transform-origin: left center;

    animation: writingArm 1s ease-in-out infinite;
}


/* Volunteer form */

.volunteer-form {

    position: absolute;

    width: 34px;
    height: 42px;

    background: #ffffff;

    border: 2px solid var(--pink);

    border-radius: 5px;

    right: 14px;
    top: 29px;

    animation: formMove 3s ease-in-out infinite;
}


/* Form lines */

.volunteer-form::before {

    content: "";

    position: absolute;

    width: 20px;
    height: 2px;

    background: var(--pink);

    left: 5px;
    top: 9px;

    box-shadow:
        0 7px 0 rgba(233, 91, 159, 0.75),
        0 14px 0 rgba(233, 91, 159, 0.55);
}


/* Pen */

.volunteer-pen {

    position: absolute;

    width: 19px;
    height: 4px;

    background: var(--dark-pink);

    border-radius: 3px;

    right: 27px;
    top: 63px;

    transform: rotate(-35deg);

    animation: penWrite 1s ease-in-out infinite;
}


/* Small activity circles */

.activity-dot {

    position: absolute;

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: var(--pink);

    left: 13px;
    top: 25px;

    animation: dotPulse 1.5s ease-in-out infinite;
}

.activity-dot.two {

    left: 15px;
    top: 40px;

    animation-delay: 0.4s;
}

.activity-dot.three {

    left: 17px;
    top: 55px;

    animation-delay: 0.8s;
}


@keyframes volunteerWalk {

    0% {
        transform: translateX(-3px);
    }

    35% {
        transform: translateX(13px);
    }

    65% {
        transform: translateX(13px);
    }

    100% {
        transform: translateX(-3px);
    }

}


@keyframes formMove {

    0%,
    30% {
        transform: translateX(0);
    }

    50%,
    70% {
        transform: translateX(-5px);
    }

    100% {
        transform: translateX(0);
    }

}


@keyframes writingArm {

    0%,
    100% {
        transform: rotate(-20deg);
    }

    50% {
        transform: rotate(15deg);
    }

}


@keyframes penWrite {

    0%,
    100% {
        transform: rotate(-35deg) translate(0, 0);
    }

    50% {
        transform: rotate(-35deg) translate(-4px, 3px);
    }

}


@keyframes dotPulse {

    0%,
    100% {
        transform: scale(0.7);
        opacity: 0.4;
    }

    50% {
        transform: scale(1.3);
        opacity: 1;
    }

}


/* =========================
   INFO BOX
========================= */

.volunteer-info {

    margin-top: 25px;

    padding: 18px;

    background: var(--light-pink);

    border: 1px solid var(--border-pink);

    border-radius: 12px;

    text-align: center;

    color: #666666;
}


/* =========================
   LOGOUT
========================= */

.logout-button {

    width: 100%;

    padding: 12px;

    border-radius: 10px;

    font-weight: 600;

    transition: 0.3s ease;
}

.logout-button:hover {

    transform: translateY(-2px);

    box-shadow:
        0 8px 20px rgba(233, 91, 159, 0.22);
}


/* =========================
   MOBILE
========================= */

@media (max-width: 768px) {

    .volunteer-header {
        padding: 50px 0;
    }

    .volunteer-header h1 {
        font-size: 30px;
    }

    .volunteer-card {
        padding: 25px;
    }

}

</style>

</head>


<body data-root="../">


<!-- NAVIGATION -->

<div data-nav></div>


<!-- HEADER -->

<section class="soft section volunteer-header">

    <div class="container">

        <h1>Volunteer Dashboard</h1>

        <p class="text-muted">
            Authentication and role-based dashboard features will be connected in Phase 2.
        </p>

    </div>

</section>


<!-- DASHBOARD -->

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="volunteer-card">


                <!-- Volunteer Animation -->

                <div class="volunteer-animation">

                    <div class="volunteer-person"></div>

                    <div class="volunteer-form"></div>

                    <div class="volunteer-pen"></div>

                    <div class="activity-dot"></div>
                    <div class="activity-dot two"></div>
                    <div class="activity-dot three"></div>

                </div>


                <div id="alertBox"></div>


                <div class="volunteer-info">

                    Volunteer dashboard is ready.

                </div>


                <button
                    class="btn btn-success logout-button mt-4"
                    id="logoutBtn">

                    Logout

                </button>


            </div>

        </div>

    </div>

</div>


<!-- EXISTING FUNCTIONALITY -->

<script>

document.addEventListener("DOMContentLoaded", async () => {

    const s = await currentSession();

    if (!s) {
        location.href = "../login.html";
        return;
    }

    document.querySelector("#logoutBtn").onclick = logout;

});

</script>


<!-- FOOTER -->

<div data-footer></div>


<!-- EXISTING SCRIPTS -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../assets/js/config.js"></script>

<script src="../assets/js/supabase.js"></script>

<script src="../assets/js/auth.js"></script>

<script src="../assets/js/main.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
