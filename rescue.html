<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Rescue | Paws & Wings</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body data-root="">

<div data-nav></div>

<section class="soft section">
  <div class="container">
    <h1>Rescue Cases</h1>
    <p class="text-muted">
      Live rescue cases from Paws & Wings.
    </p>
  </div>
</section>

<section class="section">
  <div class="container">

    <div id="rescueCases" class="row g-4">
      <div class="col-12 text-center">
        <div class="spinner-border" role="status"></div>
        <p class="mt-2">Loading rescue cases...</p>
      </div>
    </div>

  </div>
</section>

<div data-footer></div>


<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="assets/js/config.js"></script>
<script src="assets/js/supabase.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/main.js"></script>


<script>
document.addEventListener("DOMContentLoaded", async () => {

  const container = document.getElementById("rescueCases");

  if (!window.sb) {
    container.innerHTML = `
      <div class="col-12">
        <div class="alert alert-danger">
          Supabase connection failed.
        </div>
      </div>
    `;
    return;
  }

  const { data, error } = await sb
    .from("rescue_cases")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    console.error(error);

    container.innerHTML = `
      <div class="col-12">
        <div class="alert alert-danger">
          Unable to load rescue cases.
        </div>
      </div>
    `;

    return;
  }

  if (!data || data.length === 0) {
    container.innerHTML = `
      <div class="col-12">
        <div class="alert alert-info">
          No rescue cases available.
        </div>
      </div>
    `;

    return;
  }

  container.innerHTML = data.map(item => `
    <div class="col-md-6 col-lg-4">

      <div class="card h-100 shadow-sm p-4">

        <h5 class="fw-bold">
          Rescue Case
        </h5>

        <p class="mb-2">
          <strong>Location:</strong>
          ${item.location || "Not specified"}
        </p>

        <p class="mb-2">
          <strong>Priority:</strong>
          ${item.priority || "Medium"}
        </p>

        <p class="mb-2">
          <strong>Status:</strong>
          ${item.status || "Pending"}
        </p>

        <small class="text-muted">
          Created:
          ${item.created_at
            ? new Date(item.created_at).toLocaleString()
            : "N/A"}
        </small>

      </div>

    </div>
  `).join("");

});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
