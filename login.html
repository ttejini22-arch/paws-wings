<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Login | Paws & Wings</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

<link rel="stylesheet" href="assets/css/style.css">


<style>

/* =========================
   PINK + WHITE THEME
========================= */

:root {
    --pink: #e95b9f;
    --dark-pink: #d94789;
    --light-pink: #fff0f6;
    --border-pink: #f3bfd5;
}

body {
    background: #ffffff !important;
}


/* =========================
   REMOVE GREEN
========================= */

.btn-success {
    background: var(--pink) !important;
    border-color: var(--pink) !important;
    color: #ffffff !important;
}

.btn-success:hover {
    background: var(--dark-pink) !important;
    border-color: var(--dark-pink) !important;
}


/* =========================
   LOGIN AREA
========================= */

.login-section {
    min-height: 70vh;

    display: flex;
    align-items: center;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            var(--light-pink)
        );

    position: relative;
    overflow: hidden;
}


/* Background circles */

.login-section::before {
    content: "";

    position: absolute;

    width: 180px;
    height: 180px;

    border-radius: 50%;

    background: rgba(233, 91, 159, 0.10);

    left: 8%;
    top: 12%;

    animation: backgroundFloat 4s ease-in-out infinite;
}

.login-section::after {
    content: "";

    position: absolute;

    width: 120px;
    height: 120px;

    border-radius: 50%;

    background: rgba(233, 91, 159, 0.12);

    right: 10%;
    bottom: 10%;

    animation: backgroundFloat 3s ease-in-out infinite reverse;
}

@keyframes backgroundFloat {

    0%,
    100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-25px);
    }

}


/* =========================
   LOGIN CARD
========================= */

.login-card {
    background: #ffffff !important;

    border: 2px solid var(--border-pink) !important;

    border-radius: 20px !important;

    position: relative;

    overflow: hidden;

    box-shadow:
        0 12px 35px rgba(233, 91, 159, 0.12);

    animation: cardAppear 0.8s ease;
}

@keyframes cardAppear {

    from {
        opacity: 0;
        transform: translateY(25px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}


/* Moving top border */

.login-card::before {
    content: "";

    position: absolute;

    width: 100%;
    height: 4px;

    top: 0;
    left: -100%;

    background: var(--pink);

    animation: topLine 3s linear infinite;
}

@keyframes topLine {

    from {
        left: -100%;
    }

    to {
        left: 100%;
    }

}


/* =========================
   LOGIN ANIMATION
========================= */

.login-animation {
    width: 100px;
    height: 100px;

    margin: 0 auto 25px;

    border-radius: 50%;

    background: var(--light-pink);

    border: 2px solid var(--pink);

    position: relative;

    overflow: hidden;
}


/* Person */

.login-person {
    position: absolute;

    width: 28px;
    height: 38px;

    background: var(--dark-pink);

    border-radius: 14px 14px 7px 7px;

    left: 35px;
    top: 43px;

    animation: personMove 2.5s ease-in-out infinite;
}


/* Head */

.login-person::before {
    content: "";

    position: absolute;

    width: 20px;
    height: 20px;

    border-radius: 50%;

    background: var(--pink);

    left: 4px;
    top: -22px;
}


/* Login door / panel */

.login-door {
    position: absolute;

    width: 25px;
    height: 48px;

    border: 2px solid var(--pink);

    background: #ffffff;

    right: 12px;
    top: 27px;

    border-radius: 4px;

    animation: doorMove 2.5s ease-in-out infinite;
}


/* Door handle */

.login-door::before {
    content: "";

    position: absolute;

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: var(--pink);

    right: 4px;
    top: 22px;
}


/* Arrow */

.login-arrow {
    position: absolute;

    width: 25px;
    height: 3px;

    background: var(--pink);

    left: 13px;
    top: 48px;

    animation: arrowMove 1.5s ease-in-out infinite;
}

.login-arrow::after {
    content: "";

    position: absolute;

    width: 9px;
    height: 9px;

    border-right: 3px solid var(--pink);
    border-top: 3px solid var(--pink);

    transform: rotate(45deg);

    right: 0;
    top: -3px;
}


@keyframes personMove {

    0%,
    100% {
        transform: translateX(-8px);
    }

    50% {
        transform: translateX(5px);
    }

}


@keyframes doorMove {

    0%,
    100% {
        transform: translateX(3px);
    }

    50% {
        transform: translateX(0);
    }

}


@keyframes arrowMove {

    0%,
    100% {
        transform: translateX(0);
        opacity: 0.5;
    }

    50% {
        transform: translateX(8px);
        opacity: 1;
    }

}


/* =========================
   TITLE
========================= */

.login-title {
    color: var(--dark-pink);

    font-weight: 700;

    text-align: center;
}


/* =========================
   FORM
========================= */

.form-control {
    border: 1px solid var(--border-pink) !important;

    border-radius: 10px;

    padding: 11px 13px;
}

.form-control:focus {

    border-color: var(--pink) !important;

    box-shadow:
        0 0 0 0.2rem rgba(233, 91, 159, 0.15) !important;
}

.form-label {
    font-weight: 500;

    color: #555555;
}


/* =========================
   LINKS
========================= */

.login-card a {
    color: var(--dark-pink);

    text-decoration: none;

    font-weight: 500;
}

.login-card a:hover {
    color: var(--pink);

    text-decoration: underline;
}


/* =========================
   ALERT
========================= */

#alertBox .alert {

    border-radius: 10px;

    border-color: var(--border-pink);
}


/* =========================
   MOBILE
========================= */

@media (max-width: 768px) {

    .login-section {
        min-height: 75vh;
    }

    .login-animation {
        width: 90px;
        height: 90px;
    }

}

</style>

</head>


<body data-root="">


<!-- NAVIGATION -->

<div data-nav></div>


<!-- LOGIN -->

<div class="login-section">

    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-5">


                <div class="card p-4 p-md-5 login-card">


                    <!-- Login Animation -->

                    <div class="login-animation">

                        <div class="login-person"></div>

                        <div class="login-door"></div>

                        <div class="login-arrow"></div>

                    </div>


                    <h2 class="mb-3 login-title">
                        Login
                    </h2>


                    <div id="alertBox"></div>


                    <form id="loginForm">


                        <label class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            class="form-control mb-3"
                            required
                        >


                        <label class="form-label">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            class="form-control mb-2"
                            required
                        >


                        <p class="text-end mb-3">

                            <a
                                href="#"
                                id="forgotPassword">

                                Forgot Password?

                            </a>

                        </p>


                        <button
                            class="btn btn-success w-100">

                            Login

                        </button>


                    </form>


                    <p class="text-center mt-3 mb-0">

                        New user?

                        <a href="register.html">
                            Register
                        </a>

                    </p>


                </div>

            </div>

        </div>

    </div>

</div>


<!-- EXISTING LOGIN FUNCTIONALITY -->

<script>

document
.querySelector("#loginForm")
.addEventListener("submit", async e => {

    e.preventDefault();

    if (!window.sb) {

        alertBox(
            "First configure Supabase in assets/js/config.js.",
            "danger"
        );

        return;
    }


    const emailInput = document.querySelector("#email");
const passwordInput = document.querySelector("#password");

const { data, error } =
    await sb.auth.signInWithPassword({

        email: emailInput.value.trim(),
        password: passwordInput.value

    });


    if (error) {

        alertBox(
            error.message,
            "danger"
        );

        return;
    }


    const { data: p } =
        await sb
        .from("profiles")
        .select("role")
        .eq("id", data.user.id)
        .single();


    const dest = {

        admin: "admin/dashboard.html",

        ngo: "ngo/dashboard.html",

        volunteer: "volunteer/dashboard.html",

        user: "user/dashboard.html"

    }[p?.role] || "index.html";


    location.href = dest;

});


document
.querySelector("#forgotPassword")
.addEventListener("click", async e => {

    e.preventDefault();


    if (!window.sb) {

        alertBox(
            "First configure Supabase in assets/js/config.js.",
            "danger"
        );

        return;
    }


   const userEmail =
    document.querySelector("#email").value.trim();


    if (!userEmail) {

        alertBox(
            "Please enter your email first.",
            "warning"
        );

        email.focus();

        return;
    }


    const { error } =
        await sb.auth.resetPasswordForEmail(
            userEmail,
            {
                redirectTo:
                    window.location.origin +
                    "/reset-password.html"
            }
        );


    if (error) {

        alertBox(
            error.message,
            "danger"
        );

        return;
    }


    alertBox(
        "Password reset link has been sent to your email.",
        "success"
    );

});

</script>


<!-- FOOTER -->

<div data-footer></div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="assets/js/config.js"></script>

<script src="assets/js/supabase.js"></script>

<script src="assets/js/auth.js"></script>

<script src="assets/js/main.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
