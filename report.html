<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Report | Paws & Wings</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

<link rel="stylesheet" href="assets/css/style.css">


<style>

/* =========================
   PINK + WHITE THEME
========================= */

:root {
    --pink: #e95b9f;
    --dark-pink: #d94789;
    --light-pink: #fff0f6;
    --border-pink: #f3bfd5;
}

body {
    background: #ffffff !important;
}


/* =========================
   REMOVE GREEN
========================= */

.btn-success {
    background: var(--pink) !important;
    border-color: var(--pink) !important;
    color: #ffffff !important;
}

.btn-success:hover {
    background: var(--dark-pink) !important;
    border-color: var(--dark-pink) !important;
}


/* =========================
   REPORT HEADER
========================= */

.report-header {
    position: relative;
    overflow: hidden;

    padding: 70px 0;

    background:
        linear-gradient(
            135deg,
            var(--light-pink),
            #ffffff
        ) !important;
}

.report-header h1 {
    color: var(--dark-pink);
    font-weight: 700;
}

.report-header .text-muted {
    color: #666666 !important;
}


/* Floating background */

.report-header::before {
    content: "";

    position: absolute;

    width: 150px;
    height: 150px;

    border-radius: 50%;

    background: rgba(233, 91, 159, 0.10);

    right: 10%;
    top: 15px;

    animation: floatCircle 3.5s ease-in-out infinite;
}

.report-header::after {
    content: "";

    position: absolute;

    width: 60px;
    height: 60px;

    border-radius: 50%;

    background: rgba(233, 91, 159, 0.16);

    right: 25%;
    bottom: 20px;

    animation: floatCircle 2.5s ease-in-out infinite reverse;
}

@keyframes floatCircle {

    0%,
    100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-20px);
    }

}


/* =========================
   REPORT CARD
========================= */

.report-card {
    position: relative;
    overflow: hidden;

    background: #ffffff !important;

    border: 2px solid var(--border-pink) !important;

    border-radius: 20px !important;

    box-shadow:
        0 12px 35px rgba(233, 91, 159, 0.12);

    animation: cardAppear 0.8s ease;
}

@keyframes cardAppear {

    from {
        opacity: 0;
        transform: translateY(25px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}


/* Moving top line */

.report-card::before {
    content: "";

    position: absolute;

    width: 100%;
    height: 4px;

    top: 0;
    left: -100%;

    background: var(--pink);

    animation: topLine 3s linear infinite;
}

@keyframes topLine {

    from {
        left: -100%;
    }

    to {
        left: 100%;
    }

}


/* =========================
   REPORT ANIMATION
========================= */

.report-animation {
    width: 105px;
    height: 105px;

    margin: 0 auto 25px;

    border-radius: 50%;

    background: var(--light-pink);

    border: 2px solid var(--pink);

    position: relative;

    overflow: hidden;
}


/* Animal body */

.report-animal {
    position: absolute;

    width: 42px;
    height: 27px;

    background: var(--pink);

    border-radius: 15px 15px 10px 10px;

    left: 18px;
    bottom: 28px;

    animation: animalMove 2.5s ease-in-out infinite;
}


/* Animal head */

.report-animal::before {
    content: "";

    position: absolute;

    width: 23px;
    height: 23px;

    border-radius: 50%;

    background: var(--dark-pink);

    right: -12px;
    top: -5px;
}


/* Animal ear */

.report-animal::after {
    content: "";

    position: absolute;

    width: 10px;
    height: 10px;

    background: var(--dark-pink);

    border-radius: 3px;

    right: -5px;
    top: -9px;

    transform: rotate(25deg);
}


/* Report card */

.report-paper {
    position: absolute;

    width: 30px;
    height: 38px;

    background: #ffffff;

    border: 2px solid var(--pink);

    border-radius: 5px;

    right: 13px;
    top: 25px;

    animation: paperMove 2.5s ease-in-out infinite;
}


/* Paper lines */

.report-paper::before {
    content: "";

    position: absolute;

    width: 17px;
    height: 2px;

    background: var(--pink);

    left: 5px;
    top: 9px;

    box-shadow:
        0 7px 0 rgba(233, 91, 159, 0.8),
        0 14px 0 rgba(233, 91, 159, 0.6);
}


/* Alert signal */

.report-signal {
    position: absolute;

    width: 10px;
    height: 10px;

    border: 2px solid var(--pink);

    border-radius: 50%;

    left: 10px;
    top: 17px;

    animation: signalPulse 1.5s ease-out infinite;
}

.report-signal.two {
    animation-delay: 0.5s;
}


@keyframes animalMove {

    0%,
    100% {
        transform: translateX(-3px);
    }

    50% {
        transform: translateX(7px);
    }

}


@keyframes paperMove {

    0%,
    100% {
        transform: translateY(3px) rotate(-2deg);
    }

    50% {
        transform: translateY(-4px) rotate(2deg);
    }

}


@keyframes signalPulse {

    0% {
        transform: scale(0.5);
        opacity: 0;
    }

    40% {
        opacity: 1;
    }

    100% {
        transform: scale(2);
        opacity: 0;
    }

}


/* =========================
   FORM
========================= */

.form-control,
.form-select {

    border: 1px solid var(--border-pink) !important;

    border-radius: 10px;
}

.form-control:focus,
.form-select:focus {

    border-color: var(--pink) !important;

    box-shadow:
        0 0 0 0.2rem rgba(233, 91, 159, 0.15) !important;
}

.form-label {
    color: #555555;

    font-weight: 500;
}


/* File input */

input[type="file"] {
    background: #ffffff;
}

input[type="file"]::file-selector-button {

    background: var(--light-pink);

    color: var(--dark-pink);

    border: 0;

    border-right: 1px solid var(--border-pink);

    margin-right: 10px;

    padding: 8px 12px;
}


/* =========================
   ALERT
========================= */

#alertBox .alert {

    border-radius: 10px;

    border-color: var(--border-pink);
}


/* =========================
   MOBILE
========================= */

@media (max-width: 768px) {

    .report-header {
        padding: 55px 0;
    }

    .report-header h1 {
        font-size: 30px;
    }

    .report-animation {
        width: 90px;
        height: 90px;
    }

}

</style>

</head>


<body data-root="">


<!-- NAVIGATION -->

<div data-nav></div>


<!-- REPORT HEADER -->

<section class="soft section report-header">

    <div class="container">

        <h1>
            Report an Animal or Bird
        </h1>

        <p class="text-muted">
            Login is required before submitting a report.
        </p>

    </div>

</section>


<!-- REPORT FORM -->

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card p-4 p-md-5 report-card">


                <!-- Report Animation -->

                <div class="report-animation">

                    <div class="report-animal"></div>

                    <div class="report-paper"></div>

                    <div class="report-signal"></div>
                    <div class="report-signal two"></div>

                </div>


                <div id="alertBox"></div>


                <form id="reportForm">

                    <div class="row g-3">


                        <div class="col-md-6">

                            <label class="form-label">
                                Reporter Name
                            </label>

                            <input
                                class="form-control"
                                id="name"
                                required>

                        </div>


                        <div class="col-md-6">

                            <label class="form-label">
                                Phone
                            </label>

                            <input
                                class="form-control"
                                id="phone"
                                required>

                        </div>


                        <div class="col-md-6">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                required>

                        </div>


                        <div class="col-md-6">

                            <label class="form-label">
                                Animal/Bird Type
                            </label>

                            <input
                                class="form-control"
                                id="animal"
                                required>

                        </div>


                        <div class="col-md-6">

                            <label class="form-label">
                                Category
                            </label>

                            <select
                                class="form-select"
                                id="category"
                                required>

                                <option value="">
                                    Select
                                </option>

                                <option>
                                    Hungry
                                </option>

                                <option>
                                    Injured
                                </option>

                                <option>
                                    Sick
                                </option>

                                <option>
                                    Abandoned
                                </option>

                                <option>
                                    Accident Case
                                </option>

                                <option>
                                    Other
                                </option>

                            </select>

                        </div>


                        <div class="col-md-6">

                            <label class="form-label">
                                Location
                            </label>

                            <input
                                class="form-control"
                                id="location"
                                required>

                        </div>


                        <div class="col-12">

                            <label class="form-label">
                                Description
                            </label>

                            <textarea
                                class="form-control"
                                id="description"
                                rows="5"
                                required></textarea>

                        </div>


                        <div class="col-12">

                            <label class="form-label">
                                Image
                            </label>

                            <input
                                type="file"
                                class="form-control"
                                id="image"
                                accept="image/jpeg,image/png,image/webp">

                        </div>


                    </div>


                    <button class="btn btn-success mt-4">
                        Submit Report
                    </button>


                </form>


            </div>

        </div>

    </div>

</div>


<!-- EXISTING FUNCTIONALITY -->

<script>
document
    .querySelector("#reportForm")
    .addEventListener("submit", async e => {

        e.preventDefault();

        const s = await requireAuth();

        if (!s) return;

        if (!window.sb) {
            alertBox(
                "Supabase is not configured yet.",
                "danger"
            );
            return;
        }

        const name = document.querySelector("#name").value.trim();
        const phone = document.querySelector("#phone").value.trim();
        const email = document.querySelector("#email").value.trim();
        const animal = document.querySelector("#animal").value.trim();
        const category = document.querySelector("#category").value;
        const location = document.querySelector("#location").value.trim();
        const description = document.querySelector("#description").value.trim();
        const imageFile = document.querySelector("#image").files[0];
        let imageUrl = null;

if (imageFile) {
    const fileExt = imageFile.name.split(".").pop();
    const fileName = `${s.user.id}-${Date.now()}.${fileExt}`;

    const { error: uploadError } = await sb.storage
        .from("rescue-images")
        .upload(fileName, imageFile);

    if (uploadError) {
        console.error(uploadError);

        alertBox(
            "Image upload failed: " + uploadError.message,
            "danger"
        );

        return;
    }

    const { data: publicUrlData } = sb.storage
        .from("rescue-images")
        .getPublicUrl(fileName);

    imageUrl = publicUrlData.publicUrl;
}

        // Save report into animal_reports table
        const { data: report, error: reportError } = await sb
            .from("animal_reports")
            .insert({
    reporter_id: s.user.id,
    reporter_name: name,
    phone: phone,
    email: email,
    animal_type: animal,
    category: category,
    location: location,
    description: description,
    image: imageUrl
})
            .select()
            .single();

        if (reportError) {
            console.error(reportError);

            alertBox(
                "Report could not be submitted: " + reportError.message,
                "danger"
            );

            return;
        }

        // Create rescue case
        const { error: rescueError } = await sb
            .from("rescue_cases")
            .insert({
                report_id: report.id,
                location: location,
                priority: category === "Injured" || category === "Accident Case"
                    ? "High"
                    : "Medium",
                status: "Pending"
            });

        if (rescueError) {
            console.error(rescueError);

            alertBox(
                "Report saved, but rescue case could not be created: "
                + rescueError.message,
                "warning"
            );

            return;
        }

        alertBox(
            "Report submitted successfully! Rescue case created.",
            "success"
        );

        document.querySelector("#reportForm").reset();

    });
</script>


<!-- FOOTER -->

<div data-footer></div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="assets/js/config.js"></script>

<script src="assets/js/supabase.js"></script>

<script src="assets/js/auth.js"></script>

<script src="assets/js/main.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
