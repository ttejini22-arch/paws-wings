<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Contact | Paws & Wings</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

<link rel="stylesheet" href="assets/css/style.css">


<style>

/* =========================
   PINK + WHITE THEME
========================= */

:root {
    --pink: #e95b9f;
    --dark-pink: #d94789;
    --light-pink: #fff0f6;
    --border-pink: #f3bfd5;
    --white: #ffffff;
}

body {
    background: #ffffff !important;
}


/* =========================
   REMOVE GREEN
========================= */

.btn-success {
    background: var(--pink) !important;
    border-color: var(--pink) !important;
    color: #ffffff !important;
}

.btn-success:hover {
    background: var(--dark-pink) !important;
    border-color: var(--dark-pink) !important;
}


/* =========================
   CONTACT HEADER
========================= */

.contact-header {
    position: relative;
    overflow: hidden;

    padding: 70px 0;

    background:
        linear-gradient(
            135deg,
            var(--light-pink),
            #ffffff
        ) !important;
}

.contact-header h1 {
    color: var(--dark-pink);
    font-weight: 700;
}

.contact-header .lead {
    color: #666666;
}


/* Floating circles */

.contact-header::before {
    content: "";

    position: absolute;

    width: 100px;
    height: 100px;

    border-radius: 50%;

    background: rgba(233, 91, 159, 0.14);

    right: 12%;
    top: 25px;

    animation: floatCircle 3s ease-in-out infinite;
}

.contact-header::after {
    content: "";

    position: absolute;

    width: 45px;
    height: 45px;

    border-radius: 50%;

    background: rgba(233, 91, 159, 0.20);

    right: 28%;
    bottom: 20px;

    animation: floatCircle 2.3s ease-in-out infinite reverse;
}

@keyframes floatCircle {

    0%,
    100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-18px);
    }

}


/* =========================
   CONTACT CARD
========================= */

.contact-card {
    position: relative;
    overflow: hidden;

    background: #ffffff !important;

    border: 2px solid var(--border-pink) !important;

    border-radius: 18px !important;

    transition: 0.35s ease;
}

.contact-card:hover {
    transform: translateY(-5px);

    box-shadow:
        0 15px 35px rgba(233, 91, 159, 0.15) !important;
}


/* Moving pink line */

.contact-card::before {
    content: "";

    position: absolute;

    top: 0;
    left: -100%;

    width: 100%;
    height: 4px;

    background: var(--pink);

    animation: cardLine 3s linear infinite;
}

@keyframes cardLine {

    0% {
        left: -100%;
    }

    100% {
        left: 100%;
    }

}


/* =========================
   CONTACT ANIMATION
========================= */

.contact-animation {
    width: 95px;
    height: 95px;

    margin: 0 auto 25px;

    border-radius: 50%;

    background: var(--light-pink);

    border: 2px solid var(--pink);

    position: relative;

    overflow: hidden;
}


/* Message paper */

.message-paper {
    position: absolute;

    width: 42px;
    height: 30px;

    background: #ffffff;

    border: 2px solid var(--pink);

    border-radius: 5px;

    left: 25px;
    top: 32px;

    animation: paperMove 2.5s ease-in-out infinite;
}


/* Envelope/message flap */

.message-paper::before {
    content: "";

    position: absolute;

    width: 27px;
    height: 27px;

    border-right: 2px solid var(--pink);
    border-bottom: 2px solid var(--pink);

    transform: rotate(45deg);

    left: 5px;
    top: -14px;

    background: #ffffff;
}


/* Message lines */

.message-paper::after {
    content: "";

    position: absolute;

    width: 20px;
    height: 2px;

    background: var(--pink);

    left: 9px;
    top: 18px;

    box-shadow:
        0 6px 0 rgba(233, 91, 159, 0.65);
}


/* Signal waves */

.signal {
    position: absolute;

    width: 10px;
    height: 10px;

    border: 2px solid var(--pink);

    border-radius: 50%;

    right: 12px;
    top: 17px;

    animation: signalPulse 1.5s ease-out infinite;
}

.signal.two {
    animation-delay: 0.5s;
}

.signal.three {
    animation-delay: 1s;
}


@keyframes paperMove {

    0%,
    100% {
        transform: translateX(-5px) rotate(-2deg);
    }

    50% {
        transform: translateX(5px) rotate(2deg);
    }

}


@keyframes signalPulse {

    0% {
        transform: scale(0.5);
        opacity: 0;
    }

    40% {
        opacity: 1;
    }

    100% {
        transform: scale(2);
        opacity: 0;
    }

}


/* =========================
   FORM
========================= */

.form-control {
    border: 1px solid var(--border-pink) !important;
}

.form-control:focus {

    border-color: var(--pink) !important;

    box-shadow:
        0 0 0 0.2rem rgba(233, 91, 159, 0.15) !important;
}

.form-label {
    color: #555555;
    font-weight: 500;
}


/* =========================
   ALERT
========================= */

#alertBox .alert {

    background: var(--light-pink) !important;

    border: 1px solid var(--border-pink) !important;

    color: var(--dark-pink) !important;

    border-radius: 12px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 768px) {

    .contact-header {
        padding: 55px 0;
    }

    .contact-header h1 {
        font-size: 32px;
    }

}

</style>

</head>


<body data-root="">


<!-- NAVIGATION -->

<div data-nav></div>


<!-- CONTACT HEADER -->

<section class="soft section contact-header">

    <div class="container">

        <h1>Contact Us</h1>

        <p class="lead">
            For urgent rescue cases, use the Report page.
        </p>

    </div>

</section>


<!-- CONTACT FORM -->

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="card p-4 contact-card">


                <!-- Contact Animation -->

                <div class="contact-animation">

                    <div class="message-paper"></div>

                    <div class="signal"></div>
                    <div class="signal two"></div>
                    <div class="signal three"></div>

                </div>


                <div id="alertBox"></div>


                <form id="contactForm">

                    <div class="row g-3">


                        <div class="col-md-6">

                            <label class="form-label">
                                Name
                            </label>

                            <input
                                class="form-control"
                                required>

                        </div>


                        <div class="col-md-6">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                required>

                        </div>


                        <div class="col-12">

                            <label class="form-label">
                                Subject
                            </label>

                            <input
                                class="form-control"
                                required>

                        </div>


                        <div class="col-12">

                            <label class="form-label">
                                Message
                            </label>

                            <textarea
                                class="form-control"
                                rows="6"
                                required></textarea>

                        </div>


                    </div>


                    <button class="btn btn-success mt-4">
                        Send Message
                    </button>


                </form>


            </div>

        </div>

    </div>

</div>


<!-- EXISTING FUNCTIONALITY -->

<script>

document
.querySelector("#contactForm")
.addEventListener("submit", e => {

    e.preventDefault();

    alertBox(
        "Contact module is ready for Supabase connection.",
        "info"
    );

});

</script>


<!-- FOOTER -->

<div data-footer></div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="assets/js/config.js"></script>

<script src="assets/js/supabase.js"></script>

<script src="assets/js/auth.js"></script>

<script src="assets/js/main.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
