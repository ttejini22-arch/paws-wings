<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Donate | Paws & Wings</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

<link rel="stylesheet" href="assets/css/style.css">

<style>

/* ===============================
   PINK + WHITE THEME
================================ */

:root {
    --pink: #e95b9f;
    --dark-pink: #d94789;
    --light-pink: #fff0f6;
    --soft-pink: #fff8fb;
    --border-pink: #f3bfd5;
    --white: #ffffff;
    --text: #555555;
}

body {
    background: var(--white) !important;
    color: var(--text);
}


/* ===============================
   REMOVE GREEN
================================ */

.btn-success {
    background: var(--pink) !important;
    border-color: var(--pink) !important;
    color: var(--white) !important;
}

.btn-success:hover {
    background: var(--dark-pink) !important;
    border-color: var(--dark-pink) !important;
}


/* ===============================
   DONATE HEADER
================================ */

.donate-header {
    position: relative;
    overflow: hidden;
    padding: 70px 0;
    background: linear-gradient(
        135deg,
        var(--light-pink),
        var(--white)
    ) !important;
}

.donate-header h1 {
    color: var(--dark-pink);
    font-weight: 700;
}

.donate-header .lead {
    color: #666666;
}


/* ===============================
   HEADER FLOATING CIRCLES
================================ */

.donate-header::before {
    content: "";
    position: absolute;

    width: 100px;
    height: 100px;

    border-radius: 50%;

    background: rgba(233, 91, 159, 0.14);

    right: 12%;
    top: 20px;

    animation: headerCircle 3s ease-in-out infinite;
}

.donate-header::after {
    content: "";

    position: absolute;

    width: 45px;
    height: 45px;

    border-radius: 50%;

    background: rgba(233, 91, 159, 0.20);

    right: 25%;
    bottom: 20px;

    animation: headerCircle 2s ease-in-out infinite reverse;
}

@keyframes headerCircle {

    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-18px);
    }

}


/* ===============================
   DONATION CARD
================================ */

.donation-card {
    background: var(--white) !important;

    border: 2px solid var(--border-pink) !important;

    border-radius: 18px !important;

    position: relative;

    overflow: hidden;

    transition: 0.35s ease;
}

.donation-card:hover {
    transform: translateY(-6px);

    box-shadow:
        0 15px 35px rgba(233, 91, 159, 0.15) !important;
}


/* Animated top border */

.donation-card::before {
    content: "";

    position: absolute;

    top: 0;
    left: -100%;

    width: 100%;
    height: 4px;

    background: var(--pink);

    animation: donationLine 3s linear infinite;
}

@keyframes donationLine {

    0% {
        left: -100%;
    }

    100% {
        left: 100%;
    }

}


/* ===============================
   DONATION ANIMATION
================================ */

.donation-animation {
    width: 80px;
    height: 80px;

    margin: 0 auto 25px;

    border-radius: 50%;

    background: var(--light-pink);

    border: 2px solid var(--pink);

    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    animation: donationFloat 2.2s ease-in-out infinite;
}


/* Coin */

.donation-coin {
    width: 32px;
    height: 32px;

    border-radius: 50%;

    background: var(--pink);

    border: 4px solid var(--dark-pink);

    position: relative;

    animation: coinMove 1.8s ease-in-out infinite;
}


/* Coin inner circle */

.donation-coin::before {
    content: "";

    position: absolute;

    width: 12px;
    height: 12px;

    border-radius: 50%;

    border: 2px solid var(--white);

    top: 6px;
    left: 6px;
}


/* Donation hand/base */

.donation-hand {
    position: absolute;

    width: 38px;
    height: 8px;

    background: var(--dark-pink);

    border-radius: 10px;

    bottom: 20px;

    animation: handMove 1.8s ease-in-out infinite;
}


@keyframes donationFloat {

    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-7px);
    }

}

@keyframes coinMove {

    0%, 100% {
        transform: translateY(4px);
    }

    50% {
        transform: translateY(-7px);
    }

}

@keyframes handMove {

    0%, 100% {
        transform: scaleX(0.9);
    }

    50% {
        transform: scaleX(1.1);
    }

}


/* ===============================
   FORM
================================ */

.form-control,
.form-select {
    border: 1px solid var(--border-pink) !important;
    color: var(--text);
}

.form-control:focus,
.form-select:focus {

    border-color: var(--pink) !important;

    box-shadow:
        0 0 0 0.2rem rgba(233, 91, 159, 0.15) !important;
}

.form-label {
    color: #555555;
    font-weight: 500;
}


/* ===============================
   PROJECT NOTE CARD
================================ */

.note-card {
    background: var(--soft-pink) !important;

    border: 2px solid var(--border-pink) !important;

    border-radius: 18px !important;

    transition: 0.3s ease;
}

.note-card:hover {
    transform: translateY(-6px);

    box-shadow:
        0 15px 30px rgba(233, 91, 159, 0.12);
}

.note-card h4 {
    color: var(--dark-pink);
}

.note-card p {
    color: #666666 !important;
}


/* ===============================
   ALERT
================================ */

#alertBox .alert {
    background: var(--light-pink) !important;

    border: 1px solid var(--border-pink) !important;

    color: var(--dark-pink) !important;

    border-radius: 12px;
}


/* ===============================
   MOBILE
================================ */

@media (max-width: 768px) {

    .donate-header {
        padding: 55px 0;
    }

    .donate-header h1 {
        font-size: 32px;
    }

    .donate-header .lead {
        font-size: 17px;
    }

}

</style>

</head>


<body data-root="">


<!-- NAVIGATION -->

<div data-nav></div>


<!-- DONATE HEADER -->

<section class="soft section donate-header">

    <div class="container">

        <h1>Donate</h1>

        <p class="lead">
            Support food, rescue and animal welfare activities.
        </p>

    </div>

</section>


<!-- DONATION CONTENT -->

<div class="container py-5">

    <div class="row g-4">


        <!-- DONATION FORM -->

        <div class="col-lg-8">

            <div class="card p-4 donation-card">


                <!-- Donation Animation -->

                <div class="donation-animation">

                    <div class="donation-coin"></div>

                    <div class="donation-hand"></div>

                </div>


                <div id="alertBox"></div>


                <form id="donationForm">

                    <div class="row g-3">


                        <div class="col-md-6">

                            <label class="form-label">
                                Donor Name
                            </label>

                            <input
                                class="form-control"
                                required>

                        </div>


                        <div class="col-md-6">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                required>

                        </div>


                        <div class="col-md-6">

                            <label class="form-label">
                                Donation Type
                            </label>

                            <select class="form-select">

                                <option>Food</option>

                                <option>Money</option>

                            </select>

                        </div>


                        <div class="col-md-6">

                            <label class="form-label">
                                Amount (₹)
                            </label>

                            <input
                                type="number"
                                class="form-control"
                                min="0">

                        </div>


                        <div class="col-12">

                            <label class="form-label">
                                Purpose
                            </label>

                            <textarea
                                class="form-control"
                                rows="4"></textarea>

                        </div>


                    </div>


                    <button
                        class="btn btn-success mt-4">

                        Continue

                    </button>


                </form>


            </div>

        </div>

        </div>


    </div>

</div>


<!-- EXISTING FUNCTIONALITY -->

<script>

document
.querySelector("#donationForm")
.addEventListener("submit", async e => {

    e.preventDefault();

    const s = await requireAuth();

    if (s)
        alertBox(
            "Donation module is ready. Database connection comes next.",
            "info"
        );

});

</script>


<!-- FOOTER -->

<div data-footer></div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="assets/js/config.js"></script>

<script src="assets/js/supabase.js"></script>

<script src="assets/js/auth.js"></script>

<script src="assets/js/main.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
