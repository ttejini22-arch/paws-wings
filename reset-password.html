<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Reset Password | Paws & Wings</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

<link rel="stylesheet" href="assets/css/style.css">


<style>

/* =========================
   PINK + WHITE THEME
========================= */

:root {
    --pink: #e95b9f;
    --dark-pink: #d94789;
    --light-pink: #fff0f6;
    --border-pink: #f3bfd5;
}

body {
    background: #ffffff !important;
}


/* =========================
   REMOVE GREEN
========================= */

.btn-success {
    background: var(--pink) !important;
    border-color: var(--pink) !important;
    color: #ffffff !important;
}

.btn-success:hover {
    background: var(--dark-pink) !important;
    border-color: var(--dark-pink) !important;
}


/* =========================
   RESET AREA
========================= */

.reset-section {
    min-height: 75vh;

    display: flex;
    align-items: center;

    position: relative;
    overflow: hidden;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            var(--light-pink)
        );
}


/* Background circles */

.reset-section::before {
    content: "";

    position: absolute;

    width: 180px;
    height: 180px;

    border-radius: 50%;

    background: rgba(233, 91, 159, 0.10);

    left: 8%;
    top: 10%;

    animation: floatCircle 4s ease-in-out infinite;
}

.reset-section::after {
    content: "";

    position: absolute;

    width: 110px;
    height: 110px;

    border-radius: 50%;

    background: rgba(233, 91, 159, 0.13);

    right: 10%;
    bottom: 10%;

    animation: floatCircle 3s ease-in-out infinite reverse;
}

@keyframes floatCircle {

    0%,
    100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-22px);
    }

}


/* =========================
   CARD
========================= */

.reset-card {
    background: #ffffff !important;

    border: 2px solid var(--border-pink) !important;

    border-radius: 20px !important;

    position: relative;

    overflow: hidden;

    box-shadow:
        0 12px 35px rgba(233, 91, 159, 0.12);

    animation: cardAppear 0.8s ease;
}

@keyframes cardAppear {

    from {
        opacity: 0;
        transform: translateY(25px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}


/* Moving top line */

.reset-card::before {
    content: "";

    position: absolute;

    width: 100%;
    height: 4px;

    top: 0;
    left: -100%;

    background: var(--pink);

    animation: topLine 3s linear infinite;
}

@keyframes topLine {

    from {
        left: -100%;
    }

    to {
        left: 100%;
    }

}


/* =========================
   RESET ANIMATION
========================= */

.reset-animation {
    width: 100px;
    height: 100px;

    margin: 0 auto 25px;

    border-radius: 50%;

    background: var(--light-pink);

    border: 2px solid var(--pink);

    position: relative;

    overflow: hidden;
}


/* Lock */

.reset-lock {
    position: absolute;

    width: 42px;
    height: 35px;

    background: #ffffff;

    border: 3px solid var(--pink);

    border-radius: 7px;

    left: 27px;
    top: 42px;

    animation: lockMove 2.5s ease-in-out infinite;
}


/* Lock shackle */

.reset-lock::before {
    content: "";

    position: absolute;

    width: 24px;
    height: 25px;

    border: 3px solid var(--dark-pink);

    border-bottom: 0;

    border-radius: 15px 15px 0 0;

    left: 6px;
    top: -24px;
}


/* Keyhole */

.reset-lock::after {
    content: "";

    position: absolute;

    width: 7px;
    height: 12px;

    border-radius: 5px;

    background: var(--pink);

    left: 15px;
    top: 10px;

    box-shadow:
        0 0 0 3px rgba(233, 91, 159, 0.08);
}


/* Rotating key */

.reset-key {
    position: absolute;

    width: 32px;
    height: 7px;

    background: var(--dark-pink);

    border-radius: 5px;

    left: 8px;
    top: 23px;

    transform: rotate(-35deg);

    animation: keyMove 2.5s ease-in-out infinite;
}


/* Key teeth */

.reset-key::after {
    content: "";

    position: absolute;

    width: 9px;
    height: 10px;

    border-right: 3px solid var(--dark-pink);
    border-bottom: 3px solid var(--dark-pink);

    right: 0;
    top: 2px;
}


@keyframes lockMove {

    0%,
    100% {
        transform: translateY(2px);
    }

    50% {
        transform: translateY(-4px);
    }

}


@keyframes keyMove {

    0%,
    100% {
        transform:
            translateX(0)
            rotate(-35deg);
    }

    50% {
        transform:
            translateX(10px)
            rotate(-35deg);
    }

}


/* =========================
   TITLE
========================= */

.reset-title {
    color: var(--dark-pink);

    font-weight: 700;

    text-align: center;
}


/* =========================
   FORM
========================= */

.form-control {
    border: 1px solid var(--border-pink) !important;

    border-radius: 10px;

    padding: 11px 13px;
}

.form-control:focus {

    border-color: var(--pink) !important;

    box-shadow:
        0 0 0 0.2rem rgba(233, 91, 159, 0.15) !important;
}

.form-label {
    color: #555555;

    font-weight: 500;
}


/* =========================
   LINKS
========================= */

.reset-card a {
    color: var(--dark-pink);

    text-decoration: none;

    font-weight: 500;
}

.reset-card a:hover {
    color: var(--pink);

    text-decoration: underline;
}


/* =========================
   ALERTS
========================= */

#alertBox .alert {
    border-radius: 10px;

    border-color: var(--border-pink);
}


/* =========================
   MOBILE
========================= */

@media (max-width: 768px) {

    .reset-section {
        min-height: 80vh;
    }

    .reset-animation {
        width: 90px;
        height: 90px;
    }

}

</style>

</head>


<body data-root="">


<!-- NAVIGATION -->

<div data-nav></div>


<!-- RESET PASSWORD -->

<div class="reset-section">

    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-5">


                <div class="card p-4 p-md-5 reset-card">


                    <!-- Reset Animation -->

                    <div class="reset-animation">

                        <div class="reset-lock"></div>

                        <div class="reset-key"></div>

                    </div>


                    <h2 class="mb-3 reset-title">
                        Reset Password
                    </h2>


                    <p class="text-muted text-center">
                        Enter your new password below.
                    </p>


                    <div id="alertBox"></div>


                    <form id="resetForm">


                        <label class="form-label">
                            New Password
                        </label>

                        <input
                            type="password"
                            id="newPassword"
                            class="form-control mb-3"
                            minlength="6"
                            required
                        >


                        <label class="form-label">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            class="form-control mb-3"
                            minlength="6"
                            required
                        >


                        <button
                            type="submit"
                            class="btn btn-success w-100">

                            Update Password

                        </button>


                    </form>


                    <p class="text-center mt-3 mb-0">

                        <a href="login.html">
                            Back to Login
                        </a>

                    </p>


                </div>

            </div>

        </div>

    </div>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="assets/js/config.js"></script>

<script src="assets/js/supabase.js"></script>

<script src="assets/js/auth.js"></script>

<script src="assets/js/main.js"></script>


<script>

document
.querySelector("#resetForm")
.addEventListener("submit", async e => {

    e.preventDefault();


    const password =
        document.querySelector("#newPassword").value;

    const confirmPassword =
        document.querySelector("#confirmPassword").value;


    if (password !== confirmPassword) {

        document.querySelector("#alertBox").innerHTML =
            '<div class="alert alert-danger">Passwords do not match.</div>';

        return;
    }


    if (password.length < 6) {

        document.querySelector("#alertBox").innerHTML =
            '<div class="alert alert-warning">Password must be at least 6 characters.</div>';

        return;
    }


    if (!window.sb) {

        document.querySelector("#alertBox").innerHTML =
            '<div class="alert alert-danger">Supabase is not configured.</div>';

        return;
    }


    const { error } =
        await sb.auth.updateUser({

            password: password

        });


    if (error) {

        document.querySelector("#alertBox").innerHTML =
            '<div class="alert alert-danger">' +
            error.message +
            '</div>';

        return;
    }


    document.querySelector("#alertBox").innerHTML =
        '<div class="alert alert-success">Password updated successfully!</div>';


    setTimeout(() => {

        window.location.href = "login.html";

    }, 2000);

});

</script>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
