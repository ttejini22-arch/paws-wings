<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Volunteer | Paws & Wings</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

<link rel="stylesheet" href="assets/css/style.css">

<style>

/* ===============================
   PINK + WHITE
================================ */

:root {
    --pink: #e95b9f;
    --dark-pink: #d94789;
    --light-pink: #fff0f6;
    --border-pink: #f3bfd5;
    --white: #ffffff;
    --text: #555555;
}

body {
    background: var(--white) !important;
    color: var(--text);
}


/* ===============================
   REMOVE GREEN
================================ */

.btn-success {
    background: var(--pink) !important;
    border-color: var(--pink) !important;
    color: var(--white) !important;
}

.btn-success:hover {
    background: var(--dark-pink) !important;
    border-color: var(--dark-pink) !important;
}


/* ===============================
   HEADER
================================ */

.volunteer-header {
    position: relative;
    overflow: hidden;
    padding: 70px 0;

    background: linear-gradient(
        135deg,
        var(--light-pink),
        var(--white)
    ) !important;
}

.volunteer-header h1 {
    color: var(--dark-pink);
    font-weight: 700;
}

.volunteer-header .lead {
    color: #666666;
}


/* Floating circles */

.volunteer-header::before {
    content: "";

    position: absolute;

    width: 100px;
    height: 100px;

    border-radius: 50%;

    background: rgba(233, 91, 159, 0.14);

    right: 12%;
    top: 20px;

    animation: headerFloat 3s ease-in-out infinite;
}

.volunteer-header::after {
    content: "";

    position: absolute;

    width: 45px;
    height: 45px;

    border-radius: 50%;

    background: rgba(233, 91, 159, 0.20);

    right: 25%;
    bottom: 20px;

    animation: headerFloat 2.2s ease-in-out infinite reverse;
}

@keyframes headerFloat {

    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-18px);
    }

}


/* ===============================
   FORM CARD
================================ */

.volunteer-card {
    background: var(--white) !important;

    border: 2px solid var(--border-pink) !important;

    border-radius: 18px !important;

    position: relative;

    overflow: hidden;

    transition: 0.35s ease;
}

.volunteer-card:hover {
    transform: translateY(-5px);

    box-shadow:
        0 15px 35px rgba(233, 91, 159, 0.15) !important;
}


/* Moving top line */

.volunteer-card::before {
    content: "";

    position: absolute;

    top: 0;
    left: -100%;

    width: 100%;
    height: 4px;

    background: var(--pink);

    animation: cardLine 3s linear infinite;
}

@keyframes cardLine {

    0% {
        left: -100%;
    }

    100% {
        left: 100%;
    }

}


/* ===============================
   VOLUNTEER ANIMATION
================================ */

.volunteer-animation {
    width: 90px;
    height: 90px;

    margin: 0 auto 25px;

    border-radius: 50%;

    background: var(--light-pink);

    border: 2px solid var(--pink);

    position: relative;

    overflow: hidden;
}


/* Person head */

.volunteer-person::before {
    content: "";

    position: absolute;

    width: 18px;
    height: 18px;

    border-radius: 50%;

    background: var(--pink);

    top: 18px;
    left: 36px;

    animation: personHead 2s ease-in-out infinite;
}


/* Person body */

.volunteer-person {
    position: absolute;

    width: 25px;
    height: 35px;

    background: var(--dark-pink);

    border-radius: 12px 12px 6px 6px;

    left: 33px;
    top: 38px;

    animation: personWalk 2s ease-in-out infinite;
}


/* Moving arm */

.volunteer-person::after {
    content: "";

    position: absolute;

    width: 30px;
    height: 7px;

    border-radius: 8px;

    background: var(--pink);

    top: 8px;
    left: -5px;

    transform-origin: right center;

    animation: writingArm 1.2s ease-in-out infinite;
}


/* Form / clipboard */

.volunteer-form {
    position: absolute;

    width: 25px;
    height: 32px;

    background: var(--white);

    border: 2px solid var(--pink);

    border-radius: 4px;

    right: 8px;
    bottom: 17px;

    animation: formMove 2s ease-in-out infinite;
}


/* Form lines */

.volunteer-form::before {
    content: "";

    position: absolute;

    width: 13px;
    height: 2px;

    background: var(--pink);

    left: 4px;
    top: 8px;

    box-shadow:
        0 7px 0 var(--pink),
        0 14px 0 var(--pink);

    animation: writingLines 1.2s ease-in-out infinite;
}


@keyframes personHead {

    0%, 100% {
        transform: translateX(0);
    }

    50% {
        transform: translateX(-4px);
    }

}


@keyframes personWalk {

    0%, 100% {
        transform: translateX(0);
    }

    50% {
        transform: translateX(-5px);
    }

}


@keyframes writingArm {

    0%, 100% {
        transform: rotate(8deg);
    }

    50% {
        transform: rotate(-8deg);
    }

}


@keyframes formMove {

    0%, 100% {
        transform: translateX(0);
    }

    50% {
        transform: translateX(-3px);
    }

}


@keyframes writingLines {

    0%, 100% {
        opacity: 0.5;
    }

    50% {
        opacity: 1;
    }

}


/* ===============================
   FORM
================================ */

.form-control,
.form-select {
    border: 1px solid var(--border-pink) !important;
}

.form-control:focus,
.form-select:focus {

    border-color: var(--pink) !important;

    box-shadow:
        0 0 0 0.2rem rgba(233, 91, 159, 0.15) !important;
}

.form-label {
    color: #555555;
    font-weight: 500;
}


/* ===============================
   ALERT
================================ */

#alertBox .alert {

    background: var(--light-pink) !important;

    border: 1px solid var(--border-pink) !important;

    color: var(--dark-pink) !important;

    border-radius: 12px;
}


/* ===============================
   MOBILE
================================ */

@media (max-width: 768px) {

    .volunteer-header {
        padding: 55px 0;
    }

    .volunteer-header h1 {
        font-size: 32px;
    }

    .volunteer-header .lead {
        font-size: 17px;
    }

}

</style>

</head>


<body data-root="">


<!-- NAVIGATION -->

<div data-nav></div>


<!-- VOLUNTEER HEADER -->

<section class="soft section volunteer-header">

    <div class="container">

        <h1>Become a Volunteer</h1>

        <p class="lead">
            Help with rescue, feeding, transportation,
            medical assistance or awareness.
        </p>

    </div>

</section>


<!-- VOLUNTEER FORM -->

<section class="section">

    <div class="container">

        <div class="card p-4 p-md-5 volunteer-card">


            <!-- Volunteer Animation -->

            <div class="volunteer-animation">

                <div class="volunteer-person"></div>

                <div class="volunteer-form"></div>

            </div>


            <div id="alertBox"></div>


            <form id="volunteerForm">

                <div class="row g-3">


                    <div class="col-md-6">

                        <label class="form-label">
                            Name
                        </label>

                        <input
                            class="form-control"
                            required>

                    </div>


                    <div class="col-md-6">

                        <label class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            required>

                    </div>


                    <div class="col-md-6">

                        <label class="form-label">
                            Phone
                        </label>

                        <input
                            class="form-control"
                            required>

                    </div>


                    <div class="col-md-6">

                        <label class="form-label">
                            Age
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            required>

                    </div>


                    <div class="col-md-6">

                        <label class="form-label">
                            Skills
                        </label>

                        <input class="form-control">

                    </div>


                    <div class="col-md-6">

                        <label class="form-label">
                            Availability
                        </label>

                        <input class="form-control">

                    </div>


                    <div class="col-12">

                        <label class="form-label">
                            Preferred Activity
                        </label>

                        <select class="form-select">

                            <option>
                                Animal Rescue
                            </option>

                            <option>
                                Feeding
                            </option>

                            <option>
                                Transportation
                            </option>

                            <option>
                                Medical Assistance
                            </option>

                            <option>
                                Adoption Support
                            </option>

                            <option>
                                Awareness Campaign
                            </option>

                        </select>

                    </div>


                </div>


                <button class="btn btn-success mt-4">
                    Apply
                </button>


            </form>


        </div>

    </div>

</section>


<!-- EXISTING FUNCTIONALITY -->

<script>

document
.querySelector("#volunteerForm")
.addEventListener("submit", async e => {

    e.preventDefault();

    const s = await requireAuth();

    if (s)
        alertBox(
            "Volunteer module is ready. Database connection comes next.",
            "info"
        );

});

</script>


<!-- FOOTER -->

<div data-footer></div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="assets/js/config.js"></script>

<script src="assets/js/supabase.js"></script>

<script src="assets/js/auth.js"></script>

<script src="assets/js/main.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
